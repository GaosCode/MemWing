[project]
name = "memwing-benchmark"
version = "0.1.0"
description = "MemWing OpenClaw benchmark harness"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.0",
  "openai>=1.60.0",
  "orjson>=3.10.0",
  "pydantic>=2.7.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.8.0",
]

[project.scripts]
memwing-benchmark = "memwing_benchmark.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memwing_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
